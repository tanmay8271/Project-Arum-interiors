server.port=${PORT:8080}

# Origins allowed to call this API (set to your real site URL in production)
app.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}

# Local default: in-memory H2 so you can run it with zero setup.
# In production set DB_URL, DB_USER, DB_PASSWORD (MySQL) as environment variables.
spring.datasource.url=${DB_URL:jdbc:h2:mem:aurum;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true